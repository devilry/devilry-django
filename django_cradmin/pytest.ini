[pytest]
# django_cradmin is tested with its own settings, not the devilry settings.
# Run with: pytest django_cradmin
addopts =
    --no-migrations
DJANGO_SETTINGS_MODULE = django_cradmin.demo.project.test.settings
python_files =
    tests.py
    test_*.py
    *_tests.py
norecursedirs =
    static
    __pycache__
