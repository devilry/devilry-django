[pytest]
# cradmin_legacy is tested with its own settings, not the devilry settings.
# Run with: pytest cradmin_legacy
addopts =
    --no-migrations
DJANGO_SETTINGS_MODULE = cradmin_legacy.tests.settings
python_files =
    tests.py
    test_*.py
    *_tests.py
norecursedirs =
    static
    __pycache__
